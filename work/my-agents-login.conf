server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name 195.133.15.115;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://195.133.15.115$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name 195.133.15.115;
 ssl_certificate /etc/letsencrypt/live/195.133.15.115/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/195.133.15.115/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control "private, no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /login {
  limit_req zone=my_agents_login burst=5 nodelay;
  proxy_pass http://127.0.0.1:8890;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
 location = /account {
  limit_req zone=my_agents_login burst=5 nodelay;
  proxy_pass http://127.0.0.1:8890;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
 location / {
  proxy_pass http://127.0.0.1:8890;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
