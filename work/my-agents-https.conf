server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name 195.133.15.115;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://195.133.15.115$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name 195.133.15.115;
 ssl_certificate /etc/letsencrypt/live/195.133.15.115/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/195.133.15.115/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/my-agents;
 index index.html;
 auth_basic "My agents";
 auth_basic_user_file /etc/nginx/my-agents.htpasswd;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control "private, no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
